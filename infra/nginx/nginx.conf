# NGINX Configuration for Local Development & Reverse Proxy

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       c:/tools/nginx/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # Gzip Compression Settings
    # Gzip text responses (JSON, HTML, JS, CSS) ko compress kar deta hai 
    # jisse network payload 60-80% chota ho jata hai aur speed badh jati hai.
    # =========================================================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 20;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/javascript
        text/xml;

    # Backend Node.js API (Running on port 8000)
    upstream backend_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # NGINX Server listening on port 8080
    server {
        listen       8080;
        server_name  localhost;

        # Reverse Proxy all incoming traffic to the Node.js backend
        location / {
            proxy_pass http://backend_api;

            # Forward original request headers so Express knows the real client info
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
        }

        # Custom health-check / status endpoint for NGINX verification
        location /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","message":"Local NGINX is running on port 8080 and proxying to port 8000"}';
        }
    }
}

